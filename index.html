<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#db6619;
    --orange-deep:#b95212;
    --orange-soft:#fff2eb;
    --green:#237545;
    --ink:#1e1e1e;
    --muted:#6d6d6d;
    --line:#e6e3df;
    --bg:#f4f4f4;
    --err:#c62828;
    --ok:#237545;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
  }

  /* Top bar (website jaisa) */
  .topbar{background:#fff;border-bottom:1px solid var(--line)}
  .topbar-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{display:block;height:44px;width:auto}
  .tag{font-size:13px;font-weight:600;color:var(--green);background:#eaf3ed;padding:6px 12px;border-radius:999px;white-space:nowrap}

  .page{max-width:760px;margin:0 auto;padding:16px 12px 28px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}

  /* Lead strip */
  .lead{padding:18px 18px 16px;border-bottom:3px solid var(--orange);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .ld{font-size:30px;font-weight:800;color:var(--orange);line-height:1;letter-spacing:-.3px}
  .company-line{margin-top:6px;font-size:17px;font-weight:600;word-break:break-word}
  .lead-meta{text-align:right;font-size:13px;color:var(--muted)}
  .lead-meta b{color:var(--ink);font-weight:600}

  .block{padding:18px}
  .block + .block{border-top:1px solid var(--line)}
  #recvOnly + .block, #recvOnly > .block:first-child{border-top:1px solid var(--line)}
  h2{margin:0 0 14px;font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px}
  h2 small{font-weight:400;color:var(--muted);font-size:13px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field.full{grid-column:1 / -1}
  label{font-size:13px;font-weight:600;color:var(--muted)}
  input,select,textarea{
    font:inherit;color:var(--ink);background:#fff;width:100%;
    border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;
    -webkit-appearance:none;appearance:none;
  }
  select{
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;
    padding-right:34px;
  }
  textarea{min-height:90px;resize:vertical;line-height:1.45}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(219,102,25,.18)}
  .bad{border-color:var(--err)!important}
  .other-in{margin-top:6px}
  .other-in[hidden]{display:none}

  /* Products */
  .item{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
  .item:first-child{border-top:0;padding-top:0}
  .num{
    background:var(--orange-soft);color:var(--orange-deep);font-weight:700;font-size:14px;
    border-radius:8px;display:flex;align-items:center;justify-content:center;height:44px;margin-top:23px;
  }
  .item-fields{display:grid;grid-template-columns:1.6fr 1fr .9fr 38px;gap:10px;align-items:start}
  .remove{
    height:44px;width:38px;margin-top:23px;border:0;border-radius:9px;background:transparent;color:var(--muted);
    font-size:22px;cursor:pointer;line-height:1
  }
  .remove:hover{background:#fdecea;color:var(--err)}
  .remove[disabled]{visibility:hidden}
  .add-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
  .add{
    min-height:42px;padding:0 16px;border:1.5px solid var(--green);background:#fff;color:var(--green);
    border-radius:9px;font:inherit;font-weight:600;cursor:pointer
  }
  .add:hover{background:#eaf3ed}
  .add[disabled]{opacity:.5;cursor:not-allowed;background:#fff}
  .count{font-size:13px;color:var(--muted)}

  /* Save (card ke andar hi, koi khali jagah nahi) */
  .actions{padding:0 18px 18px}
  .msg{font-size:14px;font-weight:600;color:var(--err);margin-bottom:10px;display:none}
  .save{
    width:100%;min-height:50px;border:0;border-radius:10px;background:var(--orange);color:#fff;
    font:inherit;font-size:16px;font-weight:700;cursor:pointer
  }
  .save:hover{background:var(--orange-deep)}
  .save[disabled]{opacity:.65;cursor:wait}
  button:focus-visible{outline:3px solid rgba(219,102,25,.45);outline-offset:2px}

  /* States */
  .state{padding:28px 20px;text-align:center}
  .state h1{font-size:21px;margin:0 0 8px}
  .state p{margin:0;color:var(--muted)}
  .state.ok h1{color:var(--ok)}
  .check{width:84px;height:84px;margin:4px auto 16px;display:block}
  .check circle{fill:#e9f4ed;stroke:var(--ok);stroke-width:3;stroke-dasharray:252;stroke-dashoffset:252;animation:draw .5s ease-out forwards}
  .check path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .35s .45s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.check circle,.check path{animation:none;stroke-dashoffset:0}}
  .state.err h1{color:var(--err)}
  .summary{margin:18px auto 0;max-width:460px;text-align:left;border-top:1px solid var(--line)}
  .summary div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .summary div span:last-child{font-weight:700;text-align:right}

  @media (max-width:560px){
    .logo{height:36px}
    .tag{font-size:12px;padding:5px 10px}
    .grid2{grid-template-columns:1fr}
    .item-fields{grid-template-columns:1fr 1fr 38px}
    .item-fields .f-product{grid-column:1 / 3}
    .item-fields .remove{grid-column:3;grid-row:1}
    .lead-meta{text-align:left}
  }
</style>
</head>

    <span class="tag" id="tag">Product enquiry</span>

</header>

<main class="page"><div class="card" id="app"></div></main>

<script>
  var DATA = <?!= dataJson ?>;

  var app = document.getElementById('app');
  var items = [];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var CHECK_SVG = '<svg class="check" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="40"/><path d="M26 43 L37 54 L59 31"/></svg>';

  function renderState(kind, title, text, extraHtml){
    app.innerHTML = '<div class="state ' + kind + '">' + (kind === 'ok' ? CHECK_SVG : '') + '<h1>' + esc(title) + '</h1><p>' + esc(text) + '</p>' + (extraHtml || '') + '</div>';
    window.scrollTo(0, 0);
  }

  function options(list, selected, placeholder){
    var h = '<option value="">' + esc(placeholder) + '</option>';
    list.forEach(function(v){
      h += '<option value="' + esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + esc(v) + '</option>';
    });
    return h;
  }

  function renderForm(){
    var isMkt = DATA.mode === 'mkt';
    document.getElementById('tag').textContent =
      (isMkt ? 'Marketing' : 'Product') + (DATA.done ? ' · edit' : ' enquiry');
    app.innerHTML =
      '<div class="lead">' +
        '<div><div class="ld">' + esc(DATA.ld) + '</div>' +
        '<div class="company-line" id="hdrCompany">' + esc(DATA.company || 'Company name nahi hai') + '</div></div>' +
        '<div class="lead-meta">' + esc(DATA.tsKey) +
          (DATA.sales ? '<br>Sales person: <b>' + esc(DATA.sales) + '</b>' : '') + '</div>' +
      '</div>' +

      (DATA.done ? '' :
      '<div class="block">' +
        '<h2>Call status</h2>' +
        '<div class="field"><label for="callStatus">Call receive hua?</label>' +
        '<select id="callStatus"><option value="">Select</option>' +
          (DATA.callStatuses || ['Received', "Didn't Receive"]).map(function(v){ return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('') +
        '</select></div>' +
      '</div>') +

      '<div class="block">' +
        '<h2>Client details <small>zarurat ho to badlo</small></h2>' +
        '<div class="grid2">' +
          '<div class="field full"><label for="company">Company name</label><input id="company" autocomplete="off"></div>' +
          '<div class="field"><label for="owner">Owner name</label><input id="owner" autocomplete="off"></div>' +
          '<div class="field"><label for="mobile">Mobile number</label><input id="mobile" type="tel" inputmode="tel" autocomplete="off"></div>' +
          '<div class="field full"><label for="location">Location</label><input id="location" autocomplete="off"></div>' +
          (DATA.mode === 'mkt'
            ? '<div class="field full"><label for="email">Email <span style="font-weight:400">(client ka)</span></label>' +
              '<input id="email" type="email" inputmode="email" autocomplete="off" placeholder="name@company.com"></div>'
            : '') +
        '</div>' +
      '</div>' +

      '<div id="recvOnly">' +
      '<div class="block">' +
        '<h2>Products <small>maximum ' + DATA.maxProducts + '</small></h2>' +
        '<div id="items"></div>' +
        '<div class="add-row"><button type="button" class="add" id="addBtn">+ Add product</button>' +
        '<span class="count" id="count"></span></div>' +
      '</div>' +

      (DATA.mode === 'mkt'
        ? '<div class="block">' +
            '<h2>Description <small>marketing ke liye</small></h2>' +
            '<textarea id="description" rows="4" placeholder="Size, GSM, rate, delivery, client se baat ka detail…"></textarea>' +
          '</div>'
        : '') +
      '</div>' +

      '<div class="block">' +
        '<h2>Remark <small id="remarkHint">optional</small></h2>' +
        '<textarea id="remark" rows="3" placeholder="Client ki requirement, size, rate, delivery ya koi bhi note…"></textarea>' +
      '</div>' +

      '<div class="block">' +
        '<h2>Verify <small>is step ka faisla</small></h2>' +
        '<div class="field"><label for="verify">Verify</label>' +
        '<select id="verify"><option value="">Select</option><option>Yes</option><option>No</option></select></div>' +
      '</div>' +

      '<div class="actions">' +
        '<div class="msg" id="msg"></div>' +
        '<button type="button" class="save" id="saveBtn">' + (DATA.done ? 'Update enquiry' : 'Save enquiry') + '</button>' +
      '</div>';

    document.getElementById('company').value  = DATA.company  || '';
    document.getElementById('owner').value    = DATA.owner    || '';
    document.getElementById('mobile').value   = DATA.mobile   || '';
    document.getElementById('location').value = DATA.location || '';
    var emEl = document.getElementById('email');
    if (emEl) emEl.value = DATA.email || '';
    document.getElementById('remark').value   = DATA.remark   || '';
    var descEl = document.getElementById('description');
    if (descEl) descEl.value = DATA.description || '';

    var cs = document.getElementById('callStatus');
    if (cs) { cs.value = DATA.callStatus || ''; cs.addEventListener('change', applyCall); }
    document.getElementById('verify').value = DATA.verify || '';

    document.getElementById('company').addEventListener('input', function(){
      document.getElementById('hdrCompany').textContent = this.value || 'Company name nahi hai';
    });
    document.getElementById('addBtn').addEventListener('click', function(){
      if (items.length >= DATA.maxProducts) return;
      readItems();
      items.push(blankItem());
      renderItems(true);
    });
    document.getElementById('saveBtn').addEventListener('click', save);

    items = (DATA.items && DATA.items.length)
      ? DATA.items.map(function(it){ return fromSaved(it); })
      : [blankItem()];
    renderItems(false);
    applyCall();
  }

  // Naya form: dropdown se. Edit form (pehle bhara hua): dropdown nahi — koi product nahi aur Remark hai to "Didn't Receive" maana jata hai
  function notReceived(){
    var cs = document.getElementById('callStatus');
    if (cs) return cs.value === (DATA.callNotReceived || "Didn't Receive");
    return items.every(isEmpty) && !!document.getElementById('remark').value.trim();
  }

  // Call receive nahi hua → products chhupa do, Remark zaroori
  function applyCall(){
    var el = document.getElementById('callStatus');
    if (!el) { document.getElementById('recvOnly').style.display = ''; return; }   // edit: sab pehle jaisa dikhe
    var nr = notReceived(), cs = el.value;
    document.getElementById('recvOnly').style.display = (cs && !nr) ? '' : 'none';
    document.getElementById('remarkHint').textContent = nr ? 'zaroori — call kyun nahi laga / kab dobara karna hai' : 'optional';
    document.getElementById('remark').placeholder = nr ? 'Jaise: phone switch off, ring gaya par uthaya nahi, kal 11 baje dobara call…' : 'Client ki requirement, size, rate, delivery ya koi bhi note…';
  }

  var OTHER = 'Other';

  function blankItem(){ return {pSel:'', pTxt:'', qSel:'', qTxt:'', qty:''}; }

  // Sheet me save hua value → form state (list me nahi hai to "Other" + text)
  function fromSaved(it){
    var o = blankItem();
    var p = it.product || '', q = it.quality || '';
    if (p && DATA.products.indexOf(p) !== -1 && p !== OTHER) o.pSel = p; else if (p) { o.pSel = OTHER; o.pTxt = p; }
    if (q && DATA.qualities.indexOf(q) !== -1 && q !== OTHER) o.qSel = q; else if (q) { o.qSel = OTHER; o.qTxt = q; }
    o.qty = it.qty || '';
    return o;
  }

  function finalProduct(it){ return it.pSel === OTHER ? it.pTxt : it.pSel; }
  function finalQuality(it){ return it.qSel === OTHER ? it.qTxt : it.qSel; }
  function isEmpty(it){ return !it.pSel && !it.qSel && !it.qty && !it.pTxt && !it.qTxt; }

  function renderItems(focusLast){
    var box = document.getElementById('items');
    var h = '';
    items.forEach(function(it, i){
      h +=
        '<div class="item">' +
          '<div class="num">' + (i + 1) + '</div>' +
          '<div class="item-fields">' +
            '<div class="field f-product"><label for="p' + i + '">Product</label>' +
              '<select id="p' + i + '" class="in-product" data-other="pt' + i + '">' + options(DATA.products, it.pSel, 'Select product') + '</select>' +
              '<input id="pt' + i + '" class="in-product-other other-in" placeholder="Product ka naam likho" value="' + esc(it.pTxt) + '"' + (it.pSel === OTHER ? '' : ' hidden') + '></div>' +
            '<div class="field"><label for="q' + i + '">Quality</label>' +
              '<select id="q' + i + '" class="in-quality" data-other="qt' + i + '">' + options(DATA.qualities, it.qSel, 'Select') + '</select>' +
              '<input id="qt' + i + '" class="in-quality-other other-in" placeholder="Quality likho" value="' + esc(it.qTxt) + '"' + (it.qSel === OTHER ? '' : ' hidden') + '></div>' +
            '<div class="field"><label for="n' + i + '">Quantity</label>' +
              '<input id="n' + i + '" class="in-qty" type="number" inputmode="decimal" min="0" step="any" value="' + esc(it.qty) + '"></div>' +
            '<button type="button" class="remove" data-i="' + i + '" aria-label="Product ' + (i + 1) + ' hatao"' +
              (items.length === 1 ? ' disabled' : '') + '>×</button>' +
          '</div>' +
        '</div>';
    });
    box.innerHTML = h;

    // "Other" chuna to text box dikhao
    Array.prototype.forEach.call(box.querySelectorAll('.in-product, .in-quality'), function(sel){
      sel.addEventListener('change', function(){
        var txt = document.getElementById(this.getAttribute('data-other'));
        if (this.value === OTHER){ txt.hidden = false; txt.focus(); }
        else { txt.hidden = true; txt.value = ''; }
      });
    });

    Array.prototype.forEach.call(box.querySelectorAll('.remove'), function(b){
      b.addEventListener('click', function(){
        readItems();
        items.splice(Number(this.getAttribute('data-i')), 1);
        renderItems(false);
      });
    });

    var full = items.length >= DATA.maxProducts;
    var addBtn = document.getElementById('addBtn');
    addBtn.disabled = full;
    addBtn.textContent = full ? 'Maximum ' + DATA.maxProducts + ' ho gaye' : '+ Add product';
    document.getElementById('count').textContent = items.length + ' / ' + DATA.maxProducts;

    if (focusLast) document.getElementById('p' + (items.length - 1)).focus();
  }

  function readItems(){
    var rows = document.querySelectorAll('#items .item');
    items = Array.prototype.map.call(rows, function(r){
      return {
        pSel: r.querySelector('.in-product').value,
        pTxt: r.querySelector('.in-product-other').value.trim(),
        qSel: r.querySelector('.in-quality').value,
        qTxt: r.querySelector('.in-quality-other').value.trim(),
        qty:  r.querySelector('.in-qty').value.trim()
      };
    });
  }

  function showMsg(t){
    var m = document.getElementById('msg');
    m.textContent = t; m.style.display = t ? 'block' : 'none';
  }

  function validate(){
    Array.prototype.forEach.call(document.querySelectorAll('.bad'), function(el){ el.classList.remove('bad'); });
    var cs = document.getElementById('callStatus');
    if (cs && !cs.value){ cs.classList.add('bad'); cs.focus(); return 'Call status chuno (Received / Didn\'t Receive).'; }
    var company = document.getElementById('company');
    if (!company.value.trim()){ company.classList.add('bad'); company.focus(); return 'Company name bharo.'; }
    var em = document.getElementById('email');
    if (em && em.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value.trim())){ em.classList.add('bad'); em.focus(); return 'Email sahi likho (jaise: name@company.com).'; }
    var vf = document.getElementById('verify');
    if (!vf.value){ vf.classList.add('bad'); vf.focus(); return 'Verify chuno (Yes / No).'; }
    if (notReceived()){
      var rm = document.getElementById('remark');
      if (!rm.value.trim()){ rm.classList.add('bad'); rm.focus(); return 'Call receive nahi hua — Remark likhna zaroori hai.'; }
      return '';
    }

    var filled = 0;
    for (var i = 0; i < items.length; i++){
      var it = items[i];
      if (isEmpty(it)) continue;
      filled++;
      if (!it.pSel){ var p = document.getElementById('p' + i); p.classList.add('bad'); p.focus(); return 'Product ' + (i + 1) + ': product select karo.'; }
      if (it.pSel === OTHER && !it.pTxt){ var pt = document.getElementById('pt' + i); pt.classList.add('bad'); pt.focus(); return 'Product ' + (i + 1) + ': product ka naam likho.'; }
      if (it.qSel === OTHER && !it.qTxt){ var qt = document.getElementById('qt' + i); qt.classList.add('bad'); qt.focus(); return 'Product ' + (i + 1) + ': quality likho.'; }
      if (!it.qty || Number(it.qty) <= 0){ var n = document.getElementById('n' + i); n.classList.add('bad'); n.focus(); return 'Product ' + (i + 1) + ': quantity bharo.'; }
    }
    if (!filled){ var p0 = document.getElementById('p0'); if (p0){ p0.classList.add('bad'); p0.focus(); } return 'Kam se kam ek product bharo.'; }
    return '';
  }

  function save(){
    readItems();
    var err = validate();
    if (err){ showMsg(err); return; }
    showMsg('');

    var payload = {
      ld: DATA.ld,
      mode: DATA.mode || 'crm',
      verify: document.getElementById('verify').value,
      email: document.getElementById('email') ? document.getElementById('email').value.trim() : undefined,
      callStatus: document.getElementById('callStatus') ? document.getElementById('callStatus').value
                  : (notReceived() ? (DATA.callNotReceived || "Didn't Receive") : ''),
      tsKey: DATA.tsKey,
      company:  document.getElementById('company').value.trim(),
      owner:    document.getElementById('owner').value.trim(),
      mobile:   document.getElementById('mobile').value.trim(),
      location: document.getElementById('location').value.trim(),
      remark:   document.getElementById('remark').value.trim(),
      description: (!notReceived() && document.getElementById('description')) ? document.getElementById('description').value.trim() : '',
      items: notReceived() ? [] : items.filter(function(it){ return !isEmpty(it); }).map(function(it){
        return { product: finalProduct(it), quality: finalQuality(it), qty: it.qty };
      })
    };

    var btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';

    google.script.run
      .withSuccessHandler(function(res){
        var rows = payload.items.map(function(it, i){
          return '<div><span>' + (i + 1) + '. ' + esc(it.product) + (it.quality ? ' (' + esc(it.quality) + ')' : '') +
                 '</span><span>' + esc(it.qty) + '</span></div>';
        }).join('');
        renderState('ok', payload.ld + (DATA.done ? ' updated' : ' saved'),
          payload.callStatus === (DATA.callNotReceived || "Didn't Receive")
            ? 'Call receive nahi hua — remark save ho gaya. Ye page band kar sakte ho.'
            : payload.company + ' ke ' + res.count + ' product(s) sheet me ' + (DATA.done ? 'update' : 'save') + ' ho gaye. Ye page band kar sakte ho.',
          '<div class="summary">' + rows +
            (payload.remark ? '<div><span>Remark</span><span style="font-weight:500">' + esc(payload.remark) + '</span></div>' : '') +
          '</div>');
      })
      .withFailureHandler(function(e){
        btn.disabled = false; btn.textContent = DATA.done ? 'Update enquiry' : 'Save enquiry';
        showMsg((e && e.message) ? e.message : 'Save nahi hua. Dobara try karo.');
      })
      .pfSubmitProductForm(payload);
  }

  if (DATA.error){
    renderState('err', 'Form nahi khula', DATA.error);
  } else {
    renderForm();
  }
</script>
</body>
</html>
