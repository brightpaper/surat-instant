<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Paper · Lead Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#db6619; --orange-deep:#b95212; --orange-soft:#fff2eb;
    --green:#237545; --green-soft:#e9f4ed;
    --ink:#1e1e1e; --muted:#6d6d6d; --line:#e6e3df; --bg:#f4f4f4; --err:#c62828; --err-soft:#fdecea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button,input,select,textarea{font:inherit}
  textarea{resize:vertical}

  /* Top bar */
  .top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .top-in{display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
  .logo{height:38px;width:auto;display:block}
  .tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px}
  .tab{border:0;background:transparent;padding:8px 16px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
  .tab.on{background:#fff;color:var(--orange);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .grow{flex:1}
  .upd{font-size:12px;color:var(--muted)}
  .btn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--ink)}
  .btn:hover{border-color:var(--orange);color:var(--orange)}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .btn.primary:hover{background:var(--orange-deep);color:#fff}

  /* Toolbar */
  .bar{display:flex;gap:10px;align-items:center;padding:12px 18px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;max-width:420px;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff}
  .search:focus,.sel:focus{outline:none;border-color:var(--orange)}
  .chips{display:flex;gap:6px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
  .chip.on{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  .sel{border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
  .stats{display:flex;gap:16px;margin-left:auto;font-size:13px;color:var(--muted)}
  .stats b{color:var(--ink);font-size:15px}

  /* Table */
  .wrap{margin:0 18px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 150px)}
  table{border-collapse:separate;border-spacing:0;min-width:100%}
  th,td{border-bottom:1px solid var(--line);border-right:1px solid #f0eeeb;padding:7px 10px;text-align:left;white-space:nowrap;vertical-align:middle}
  /* poora header (orange step row + green column row) ek saath fixed — beech me gap nahi */
  thead{position:sticky;top:0;z-index:6}
  thead th{background:var(--green);color:#fff;font-weight:600}
  thead tr.grp th{background:var(--orange);color:#fff;text-align:center;font-weight:700;font-size:13px;height:32px;border-bottom-color:var(--orange)}
  thead tr.hdr th{height:40px}
  thead tr.steprow th{font-size:12px;letter-spacing:.6px;height:24px;border-top:1px solid rgba(255,255,255,.35)}
  /* step ke beech mota border (sheet jaisa) */
  th.gstart,td.gstart{border-left:2px solid #1e1e1e}
  tbody tr:hover td{background:#fafaf8}
  td.sticky,th.sticky{position:sticky;z-index:4;background:#fff}
  th.sticky{z-index:7;background:var(--green)}
  thead tr.grp th.sticky{background:var(--orange)}
  td.wrapcell{white-space:normal;min-width:180px;max-width:280px}
  a.lk{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:600;text-decoration:none;font-size:12.5px}
  a.lk.fill{background:var(--orange-soft);color:var(--orange-deep);border:1px solid #f6c9ad}
  a.lk.edit{background:var(--green-soft);color:var(--green);border:1px solid #bfdcc9}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:12.5px;background:var(--green-soft);color:var(--green)}
  .late{color:var(--err);font-weight:600}
  .ontime{color:var(--green);display:block;text-align:center}
  td select{border:1.5px solid var(--line);border-radius:7px;padding:4px 6px;background:#fff;min-width:96px}
  td select.saving{opacity:.5}
  td select.yes{border-color:#9fd0b0;background:var(--green-soft)}
  td select.no{border-color:#f2b8b5;background:var(--err-soft)}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  /* Login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px;text-align:center}
  .login-card img{height:46px;margin-bottom:14px}
  .login-card h1{font-size:18px;margin:0 0 16px}
  .login-card input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:12px;text-align:center;font-size:16px;letter-spacing:2px}
  .login-card .btn{width:100%;padding:11px}
  .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .who b{color:var(--ink)}
  .who .role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green)}
  .msg{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .toast.err{background:var(--err)}
  .loading{padding:50px;text-align:center;color:var(--muted)}
  @media (max-width:700px){ .stats{margin-left:0;width:100%} .wrap{margin:0 8px 8px} .bar{padding:10px 8px} }

  td .yes{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);font-weight:600;font-size:12.5px}
  td .no{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--err-soft);color:var(--err);font-weight:600;font-size:12.5px}
  a.open{color:var(--muted);text-decoration:none;font-size:13px}
  a.open:hover{color:var(--orange)}
  .setup{max-width:560px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;line-height:1.6}

  /* New Client modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
  .modal-card{background:#fff;border-radius:14px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .modal-head{display:flex;align-items:center;padding:14px 18px;background:var(--orange);color:#fff;border-radius:14px 14px 0 0}
  .modal-head h2{font-size:16px;margin:0;flex:1}
  .modal-head .x{border:0;background:transparent;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
  .modal form{padding:16px 18px 18px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
  .fld label i{color:var(--err);font-style:normal}
  .fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--orange)}
  .fld .hint{font-size:12px;color:var(--orange-deep);margin-top:4px}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .modal-foot .btn[disabled]{opacity:.6;cursor:wait}

  /* Header filters (Excel jaisa) */
  .th-in{display:flex;align-items:center;gap:6px;justify-content:space-between}
  .fbtn{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:5px;width:22px;height:22px;line-height:22px;padding:0;cursor:pointer;font-size:11px;flex:none}
  .fbtn:hover{background:rgba(255,255,255,.32)}
  .fbtn.on{background:#fff;color:var(--green)}
  .fpop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:260px;max-width:calc(100vw - 16px);color:var(--ink);font-weight:400}
  .fpop .fp-head{padding:10px 12px 6px;font-weight:700;font-size:13px}
  .fpop .fp-sort{display:flex;gap:6px;padding:0 12px 8px}
  .fpop .fp-sort button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px;cursor:pointer;font-size:12px}
  .fpop .fp-sort button:hover{border-color:var(--orange);color:var(--orange)}
  .fpop input[type=search]{width:calc(100% - 24px);margin:0 12px 8px;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px}
  .fpop input[type=search]:focus{outline:none;border-color:var(--orange)}
  .fpop .fp-list{max-height:240px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0}
  .fpop label{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fpop label:hover{background:#faf8f5}
  .fpop label .cnt{margin-left:auto;color:var(--muted);font-size:11px}
  .fpop label.all{font-weight:600}
  .fpop .fp-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px}
  .fclear{display:none}
  .fclear.show{display:inline-block}
</style>
</head>

function getValues(sheet, render, sid){
  var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + (sid || SHEET_ID) + '/values/' +
            encodeURIComponent("'" + sheet + "'") + '?valueRenderOption=' + render + '&key=' + API_KEY;
  return fetch(url).then(function(r){ return r.json(); }).then(function(j){
    if (j.error) throw new Error(j.error.message || 'Sheets API error');
    return j.values || [];
  });
}

// sheet me jo columns hide kiye hain unki list (true = hidden)
// ek hi call me: kaun se columns hide hain + kis cell me sheet ne dropdown (data validation list) lagaya hai
function getMeta(sheet, sid){
  var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + (sid || SHEET_ID) + '?ranges=' + encodeURIComponent("'" + sheet + "'") +
            '&fields=' + encodeURIComponent('sheets(data(columnMetadata(hiddenByUser),rowData(values(dataValidation(condition)))))') + '&key=' + API_KEY;
  return fetch(url).then(function(r){ return r.json(); }).then(function(j){
    var meta = (((j.sheets || [])[0] || {}).data || [])[0] || {};
    var hidden = (meta.columnMetadata || []).map(function(m){ return !!(m && m.hiddenByUser); });
    var dv = (meta.rowData || []).map(function(row){
      return ((row && row.values) || []).map(function(c){
        var cond = c && c.dataValidation && c.dataValidation.condition;
        return cond && cond.type === 'ONE_OF_LIST' ? (cond.values || []).map(function(v){ return String(v.userEnteredValue); }) : null;
      });
    });
    return { hidden: hidden, dv: dv };
  }).catch(function(){ return { hidden: [], dv: [] }; });
}

// mustHave = header row pehchaanne ke shabd (na do to purana tarika: Links + Lead No / Company Name)
function parseSheet(disp, form, meta, mustHave){
  meta = meta || {};
  var hidden = meta.hidden || [], dv = meta.dv || [];
  var hr = -1;
  for (var r = 0; r < Math.min(disp.length, 30); r++) {
    var n = (disp[r] || []).map(norm);
    var ok = mustHave
      ? mustHave.every(function(m){ return n.indexOf(m) !== -1; })
      : (n.indexOf('links') !== -1 && (n.indexOf('leadno') !== -1 || n.indexOf('companyname') !== -1));
    if (ok) { hr = r; break; }
  }
  if (hr === -1) throw new Error('Header row nahi mili (' + (mustHave ? mustHave.join(' / ') : 'Links / Lead No / Company Name') + ').');

  var head = disp[hr] || [], columns = [];
  head.forEach(function(h, i){ var t = String(h).replace(/\s+/g, ' ').trim(); if (t && !hidden[i]) columns.push({ c: i, name: t }); });
  var lastCol = columns.length ? columns[columns.length - 1].c : 0;

  // ---- Steps: har "Planned" header se ek step shuru hota hai (agle Planned se pehle tak) ----
  //      Naam (orange row) aur "STEP n" (row 1) sheet ki upar wali rows se — jo us step ke andar ya usse pehle likha ho
  var STEP_RE = /^step\s*-?\s*(\d+)/i, stepMarks = [], titleMarks = [];
  for (var t = 0; t < hr; t++) {
    var row = disp[t] || [];
    if (row.some(function(x){ return STEP_RE.test(String(x || '').trim()); })) {          // STEP row
      for (var c = 0; c <= lastCol; c++) { var sm = String(row[c] || '').trim().match(STEP_RE); if (sm) stepMarks.push({ c: c, text: 'STEP ' + sm[1] }); }
      continue;
    }
    if (titleMarks.length) continue;                                                         // pehli naam wali row hi
    for (var c2 = 0; c2 <= lastCol; c2++) {
      var v = String(row[c2] || '').trim();
      if (/[a-z]{3}/i.test(v) && !/^\d/.test(v) && !/with\s*in/i.test(v)) titleMarks.push({ c: c2, text: v });
    }
  }

  var plannedCols = columns.filter(function(col){ return norm(col.name) === 'planned'; }).map(function(col){ return col.c; });
  var groups = [];
  if (plannedCols.length) {
    var prevTo = -1;
    plannedCols.forEach(function(pc, k){
      var to = k + 1 < plannedCols.length ? plannedCols[k + 1] - 1 : lastCol;
      var pick = function(list){ var x = list.filter(function(m){ return m.c > prevTo && m.c <= to; }); return x.length ? x[x.length - 1].text : ''; };
      groups.push({ from: pc, to: to, text: retitle(pick(titleMarks)), step: pick(stepMarks) });
      prevTo = to;
    });
  } else {
    titleMarks.forEach(function(m, k){ groups.push({ from: m.c, to: k + 1 < titleMarks.length ? titleMarks[k + 1].c - 1 : lastCol, text: retitle(m.text), step: '' }); });
  }

  var rows = [];
  for (var r2 = hr + 1; r2 < disp.length; r2++) {
    var d = disp[r2] || [], f = (form[r2] || []), opt = dv[r2] || [], any = false;
    var cells = columns.map(function(col){
      var cell = { v: d[col.c] == null ? '' : String(d[col.c]) };
      if (cell.v !== '') any = true;
      var m = String(f[col.c] || '').match(/HYPERLINK\(\s*"([^"]+)"\s*[,;]\s*"([^"]*)"/i);
      if (m) { cell.u = m[1]; cell.v = cell.v || m[2]; any = true; }
      if (opt[col.c]) cell.opts = opt[col.c];   // sheet me is cell me dropdown hai
      return cell;
    });
    if (any) rows.push({ r: r2 + 1, c: cells });
  }
  return { columns: columns, groups: groups, rows: rows };
}

function load(){
  var cfg = tabCfg(), key = cfg.key;
  state.loading = true; setUpd('Loading…');
  return Promise.all([getValues(cfg.sheet, 'FORMATTED_VALUE', cfg.sheetId), getValues(cfg.sheet, 'FORMULA', cfg.sheetId), getMeta(cfg.sheet, cfg.sheetId)])
    .then(function(res){
      var d = parseSheet(res[0], res[1], res[2], cfg.mustHave);
      d._at = Date.now(); state.data[key] = d; state.loading = false;
      if (key === state.tab) renderTable();
    })
    .catch(function(err){ state.loading = false; setUpd(''); toast(err.message || 'Data nahi aaya', true);
      var w = document.getElementById('wrap'); if (w && !state.data[key]) w.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; });
}

function setUpd(t){ var el = document.getElementById('upd'); if (el) el.textContent = t; }
setInterval(function(){ var d = state.data[state.tab]; if (d && d._at && !state.loading) setUpd('Updated ' + Math.round((Date.now() - d._at) / 1000) + 's ago'); }, 1000);
setInterval(function(){ if (document.visibilityState === 'visible' && !state.loading && !Object.keys(state.pending).length) load(); }, AUTO_REFRESH_SEC * 1000);

      '<img class="logo" src="' + LOGO + '" alt="Bright Paper">' +
      '<div class="tabs">' + TABS.map(function(s){
        return '<button class="tab' + (s.key === state.tab ? ' on' : '') + '" data-k="' + s.key + '">' + esc(s.label) + '</button>'; }).join('') + '</div>' +
      '<div class="grow"></div><span class="upd" id="upd"></span>' +
      '<button class="btn primary" id="newClient">+ New Client</button>' +
      '<button class="btn" id="refresh">↻ Refresh</button>' +
      (state.user && state.user !== '?' ? '<span class="who"><b>' + esc(state.user) + '</b><span class="role">MKT</span></span>' : '') +
    '</div></header>' +
    '<div class="bar">' +
      '<input class="search" id="q" placeholder="Search: company, owner, mobile, LD…" value="' + esc(state.q) + '">' +
      '<div class="chips">' + ['all:All', 'pending:Form pending', 'done:Form done'].map(function(x){ var p = x.split(':');
          return '<button class="chip' + (state.form === p[0] ? ' on' : '') + '" data-f="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div>' +
      '<select class="sel" id="plat"></select>' +
      '<button class="chip" id="order">' + (state.newest ? 'Newest first' : 'Oldest first') + '</button>' +
      '<button class="chip fclear" id="fclear">✕ Clear column filters</button>' +
      '<div class="stats" id="stats"></div>' +
    '</div>' +
    '<div class="wrap" id="wrap"><div class="loading">Loading…</div></div>';

  Array.prototype.forEach.call(root.querySelectorAll('.tab'), function(b){
    b.onclick = function(){ state.tab = this.getAttribute('data-k'); localStorage.setItem('bp_tab', state.tab); state.platform = '';
      Array.prototype.forEach.call(root.querySelectorAll('.tab'), function(x){ x.classList.toggle('on', x === b); });
      if (state.data[state.tab]) renderTable(); else document.getElementById('wrap').innerHTML = '<div class="loading">Loading…</div>';
      load(); };
  });
  Array.prototype.forEach.call(root.querySelectorAll('.chip[data-f]'), function(b){
    b.onclick = function(){ state.form = this.getAttribute('data-f');
      Array.prototype.forEach.call(root.querySelectorAll('.chip[data-f]'), function(x){ x.classList.toggle('on', x === b); }); renderTable(); };
  });
  document.getElementById('q').oninput = function(){ state.q = this.value; renderTable(); };
  document.getElementById('plat').onchange = function(){ state.platform = this.value; renderTable(); };
  document.getElementById('order').onclick = function(){ state.newest = !state.newest; this.textContent = state.newest ? 'Newest first' : 'Oldest first'; renderTable(); };
  document.getElementById('refresh').onclick = function(){ load(); };
  document.getElementById('newClient').onclick = openNewClient;
  document.getElementById('fclear').onclick = function(){ state.colFilters[state.tab] = {}; state.sort[state.tab] = null; renderTable(); };
}

/* ---------- Kaun dekh raha hai: portal ke link se (…/?user=Suresh) ----------
 *  MKT wale (Sales Person list) → FMS pura, MKT tab me sirf unki apni parties (Sales Person = naam).
 *  Baaki sab / bina naam ke → sab kuch.
 */
function urlUser(){
  var m = location.search.match(/[?&]user=([^&#]*)/), n = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')).trim() : '';
  if (/[{}]/.test(n)) return '?';   // portal ne {name} ki jagah naam nahi bhara → MKT me kuch mat dikhao
  // portal poora naam bhej sakta hai ("Suresh Patel") — sheet me pehla naam hai, isliye pehle shabd se milao
  var first = norm(n.split(/\s+/)[0]);
  var list = NC_FIELDS.filter(function(f){ return f.k === 'sales'; })[0].options;
  return list.filter(function(x){ return norm(x) === first; })[0] || null;
}

function visibleRows(d){
  if (!state.user || state.tab !== 'mkt') return d.rows;
  if (state.user === '?') return [];
  var i = colIndex(d, ['salesperson']), me = norm(state.user);
  return i < 0 ? [] : d.rows.filter(function(r){ return norm(r.c[i].v) === me; });
}

/* ---------- New Client form (Enquiry Sheet me save hota hai, FMS wahi se data leta hai) ---------- */
var NC_FIELDS = [
  { k: 'company',  label: 'Company Name',  req: true },
  { k: 'owner',    label: 'Owner Name',    req: true },
  { k: 'mobile',   label: 'Mobile Number', req: true },
  { k: 'location', label: 'Location',      options: ['Surat', 'Vapi', 'Vadodara'], other: true },
  { k: 'sales',    label: 'Sales Person',  options: ['Narendra', 'Suresh', 'Lokesh', 'Harsh'] }
];

function openNewClient(){
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ncTitle">' +
    '<div class="modal-head"><h2 id="ncTitle">New Client</h2><button type="button" class="x" aria-label="Close">×</button></div>' +
    '<form novalidate>' + NC_FIELDS.map(function(f){
      var lbl = '<div class="fld"><label for="nc_' + f.k + '">' + f.label + (f.req ? ' <i>*</i>' : '') + '</label>';
      if (f.options) return lbl + '<select id="nc_' + f.k + '" name="' + f.k + '"><option value="">— Select —</option>' +
        f.options.map(function(v){ return '<option>' + esc(v) + '</option>'; }).join('') +
        (f.other ? '<option value="__other">Other (type karo)</option>' : '') + '</select>' +
        (f.other ? '<input id="nc_' + f.k + '_other" name="' + f.k + '_other" autocomplete="off" placeholder="' + f.label + ' likho" style="display:none;margin-top:8px">' : '') + '</div>';
      return lbl + '<input id="nc_' + f.k + '" name="' + f.k + '" autocomplete="off"' +
        (f.k === 'mobile' ? ' inputmode="numeric" maxlength="10" placeholder="10 digit"' : '') + '>' +
        (f.k === 'mobile' ? '<div class="hint" id="nc_dupe"></div>' : '') + '</div>';
    }).join('') +
    '<div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div>' +
    '</form></div>';
  document.body.appendChild(m);

  var form = m.querySelector('form'), save = form.querySelector('[type=submit]'), busy = false;
  function close(){ if (!busy) { document.removeEventListener('keydown', onKey); m.remove(); } }
  function onKey(e){ if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  m.querySelector('.x').onclick = close;
  form.querySelector('[data-close]').onclick = close;
  m.onclick = function(e){ if (e.target === m) close(); };

  NC_FIELDS.forEach(function(f){
    if (!f.other) return;
    var other = form[f.k + '_other'];
    form[f.k].onchange = function(){ var on = this.value === '__other'; other.style.display = on ? '' : 'none'; if (on) other.focus(); };
  });

  // same number pehle se FMS me hai to warning
  var fms = state.data.fms, iMob = fms ? colIndex(fms, ['mobilenumber', 'mobileno', 'mobile']) : -1, iLd = fms ? colIndex(fms, ['leadno']) : -1;
  var mob = form.mobile, dupe = document.getElementById('nc_dupe');
  mob.oninput = function(){
    this.value = this.value.replace(/\D/g, '').slice(0, 10);
    var hit = this.value.length === 10 && iMob >= 0 && fms.rows.filter(function(r){ return r.c[iMob].v.replace(/\D/g, '').slice(-10) === mob.value; })[0];
    dupe.textContent = hit ? 'Ye number pehle se FMS me hai' + (iLd >= 0 && hit.c[iLd].v ? ' (' + hit.c[iLd].v + ')' : '') + '.' : '';
  };
  form.company.focus();

  form.onsubmit = function(e){
    e.preventDefault();
    if (busy) return;
    var data = {};
    NC_FIELDS.forEach(function(f){ var v = form[f.k].value; data[f.k] = (v === '__other' ? form[f.k + '_other'].value : v).trim(); });
    var miss = NC_FIELDS.filter(function(f){ return f.req && !data[f.k]; })[0];
    if (miss) { toast(miss.label + ' bharo.', true); form[miss.k].focus(); return; }
    if (!/^\d{10}$/.test(data.mobile)) { toast('Mobile Number 10 digit ka hona chahiye.', true); mob.focus(); return; }

    busy = true; save.disabled = true; save.textContent = 'Saving…';
    // text/plain = no CORS preflight (Apps Script ke liye zaroori)
    fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || 'Save nahi hua');
        busy = false; close();
        toast('Client add ho gaya' + (j.leadNo ? ' · ' + j.leadNo : ''));
        if (state.tab === 'fms') load(); else delete state.data.fms;
      })
      .catch(function(err){ busy = false; save.disabled = false; save.textContent = 'Save'; toast(err.message || 'Save nahi hua', true); });
  };
}

/* ---------- Column filters (header ▾) ---------- */
var BLANK = '(Blanks)';
function cellKey(v){ v = String(v == null ? '' : v).trim(); return v === '' ? BLANK : v; }

function passColFilters(d, r){
  var cf = state.colFilters[state.tab];
  if (!cf) return true;
  for (var name in cf) {
    var i = d.columns.map(function(c){ return c.name; }).indexOf(name);
    if (i < 0) continue;                                   // column ab nahi hai → filter ignore
    if (!cf[name][cellKey(r.c[i].v)]) return false;
  }
  return true;
}

// date (dd/MM/yyyy HH:mm:ss), number ya text — teeno sahi order me
function cmpVals(a, b){
  var pa = parseVal(a), pb = parseVal(b);
  if (pa.t !== pb.t) return pa.t < pb.t ? -1 : 1;
  return pa.v < pb.v ? -1 : pa.v > pb.v ? 1 : 0;
}
function parseVal(v){
  v = String(v == null ? '' : v).trim();
  if (!v || v === '-') return { t: 2, v: '' };
  var m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return { t: 0, v: new Date(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)).getTime() };
  var n = Number(v.replace(/[, ]/g, ''));
  if (!isNaN(n) && /\d/.test(v)) return { t: 0, v: n };
  return { t: 1, v: v.toLowerCase() };
}

function closeColFilter(){ var p = document.getElementById('fpop'); if (p) p.remove(); document.removeEventListener('mousedown', outsideFp); document.removeEventListener('keydown', escFp); }
function outsideFp(e){ var p = document.getElementById('fpop'); if (p && !p.contains(e.target)) closeColFilter(); }
function escFp(e){ if (e.key === 'Escape') closeColFilter(); }

function openColFilter(btn, ci){
  closeColFilter();
  var d = state.data[state.tab]; if (!d) return;
  var name = d.columns[ci].name, tab = state.tab;
  var cf = state.colFilters[tab] = state.colFilters[tab] || {};
  // values: baaki filters lagne ke baad jo rows bachti hain (is column ka filter chhod kar)
  var saved = cf[name]; delete cf[name];
  var base = visibleRows(d).filter(function(r){ return passColFilters(d, r); });
  if (saved) cf[name] = saved;
  var counts = {};
  base.forEach(function(r){ var k = cellKey(r.c[ci].v); counts[k] = (counts[k] || 0) + 1; });
  var vals = Object.keys(counts).sort(function(a, b){ return a === BLANK ? 1 : b === BLANK ? -1 : cmpVals(a, b); });
  var sel = {}; vals.forEach(function(v){ sel[v] = saved ? !!saved[v] : true; });

  var p = document.createElement('div');
  p.className = 'fpop'; p.id = 'fpop';
  p.innerHTML = '<div class="fp-head">' + esc(name) + '</div>' +
    '<div class="fp-sort"><button type="button" data-s="1">↑ Sort A→Z</button><button type="button" data-s="-1">↓ Sort Z→A</button></div>' +
    '<input type="search" placeholder="Search…" aria-label="Values search">' +
    '<div class="fp-list"></div>' +
    '<div class="fp-foot"><button type="button" class="btn" data-x="clear">Clear</button><button type="button" class="btn primary" data-x="ok">Apply</button></div>';
  document.body.appendChild(p);
  var rect = btn.getBoundingClientRect();
  p.style.top = Math.min(rect.bottom + 6, window.innerHeight - p.offsetHeight - 8) + 'px';
  p.style.left = Math.max(8, Math.min(rect.left - 200, window.innerWidth - p.offsetWidth - 8)) + 'px';

  var list = p.querySelector('.fp-list'), search = p.querySelector('input');
  function draw(){
    var q = search.value.trim().toLowerCase();
    var shown = vals.filter(function(v){ return !q || v.toLowerCase().indexOf(q) !== -1; });
    var allOn = shown.length && shown.every(function(v){ return sel[v]; });
    list.innerHTML = '<label class="all"><input type="checkbox" data-all' + (allOn ? ' checked' : '') + '> Select all' + (q ? ' (search)' : '') + '</label>' +
      shown.slice(0, 500).map(function(v){
        return '<label title="' + esc(v) + '"><input type="checkbox" data-v="' + esc(v) + '"' + (sel[v] ? ' checked' : '') + '> ' + esc(v) + '<span class="cnt">' + counts[v] + '</span></label>';
      }).join('') + (shown.length > 500 ? '<label>… ' + (shown.length - 500) + ' aur (search karo)</label>' : '');
    list.querySelector('[data-all]').onchange = function(){ var on = this.checked; shown.forEach(function(v){ sel[v] = on; }); draw(); };
    Array.prototype.forEach.call(list.querySelectorAll('[data-v]'), function(c){ c.onchange = function(){ sel[this.getAttribute('data-v')] = this.checked; draw(); }; });
  }
  search.oninput = draw;
  draw();
  search.focus();

  Array.prototype.forEach.call(p.querySelectorAll('[data-s]'), function(b){
    b.onclick = function(){ state.sort[tab] = { name: name, dir: +this.getAttribute('data-s') }; closeColFilter(); renderTable(); };
  });
  p.querySelector('[data-x="clear"]').onclick = function(){
    delete cf[name]; if (state.sort[tab] && state.sort[tab].name === name) state.sort[tab] = null;
    closeColFilter(); renderTable();
  };
  p.querySelector('[data-x="ok"]').onclick = function(){
    var on = vals.filter(function(v){ return sel[v]; });
    if (on.length === vals.length) delete cf[name];
    else { var m = {}; on.forEach(function(v){ m[v] = true; }); cf[name] = m; }
    closeColFilter(); renderTable();
  };
  setTimeout(function(){ document.addEventListener('mousedown', outsideFp); document.addEventListener('keydown', escFp); }, 0);
}

/* ---------- Table ---------- */
function colIndex(d, names){ for (var i = 0; i < d.columns.length; i++) if (names.indexOf(norm(d.columns[i].name)) !== -1) return i; return -1; }

function renderTable(){
  var d = state.data[state.tab], wrap = document.getElementById('wrap');
  if (!wrap || !d) return;
  var cfg = tabCfg();
  var iLinks = colIndex(d, ['links', 'link']), iPlat = colIndex(d, ['platform']);
  var iDelay = d.columns.map(function(c, i){ return /timedelay/.test(norm(c.name)) ? i : -1; }).filter(function(i){ return i >= 0; });
  var wrapCols = d.columns.map(function(c, i){ return /description|remark|requirement|reference/.test(norm(c.name)) ? i : -1; }).filter(function(i){ return i >= 0; });
  var edit = editCols(d), all = visibleRows(d);   // MKT user → sirf apni parties

  var plat = document.getElementById('plat');
  if (iPlat >= 0) {
    var vals = {}; all.forEach(function(r){ var v = r.c[iPlat].v; if (v) vals[v] = 1; });
    plat.style.display = '';
    plat.innerHTML = '<option value="">All platforms</option>' + Object.keys(vals).sort().map(function(v){
      return '<option' + (v === state.platform ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
  } else plat.style.display = 'none';

  var q = state.q.trim().toLowerCase();
  var rows = all.filter(function(r){
    if (iLinks >= 0 && state.form !== 'all') {
      var t = norm(r.c[iLinks].v);
      if (state.form === 'pending' && t !== 'fillform') return false;
      if (state.form === 'done' && t !== 'editform') return false;
    }
    if (state.platform && iPlat >= 0 && r.c[iPlat].v !== state.platform) return false;
    if (q && r.c.map(function(x){ return x.v; }).join(' ').toLowerCase().indexOf(q) === -1) return false;
    if (!passColFilters(d, r)) return false;
    return true;
  });
  if (state.newest) rows = rows.slice().reverse();
  var srt = state.sort[state.tab];
  if (srt) {
    var si = d.columns.map(function(c){ return c.name; }).indexOf(srt.name);
    if (si >= 0) rows = rows.slice().sort(function(a, b){ return cmpVals(a.c[si].v, b.c[si].v) * srt.dir; });
  }
  var fc = document.getElementById('fclear'), cf = state.colFilters[state.tab] || {};
  if (fc) fc.classList.toggle('show', Object.keys(cf).length > 0 || !!srt);

  var pend = 0, done = 0;
  if (iLinks >= 0) all.forEach(function(r){ var t = norm(r.c[iLinks].v); if (t === 'fillform') pend++; else if (t === 'editform') done++; });
  document.getElementById('stats').innerHTML = '<span>Showing <b>' + rows.length + '</b> / ' + all.length + '</span>' +
    (iLinks >= 0 ? '<span>Pending <b style="color:var(--orange)">' + pend + '</b></span><span>Done <b style="color:var(--green)">' + done + '</b></span>' : '');

  // FREEZE: pehle step (pehla "Planned") se pehle ke saare columns (Timestamp … Location) left me fixed
  var firstStep = -1;
  d.columns.forEach(function(col, i){ if (firstStep < 0 && d.groups.some(function(g){ return col.c === g.from; })) firstStep = i; });
  var stickyN = firstStep > 0 ? firstStep : 2;

  // header ke upar 2 rows: step ka NAAM (upar) + "STEP n" (neeche) — dono orange, step ke beech border
  var grpHtml = '', gStart = {};
  if (d.groups.length) {
    var nameCells = [], stepCells = [], i = 0;
    while (i < d.columns.length) {
      var c = d.columns[i].c, g = d.groups.filter(function(g){ return c >= g.from && c <= g.to; })[0], span = 1;
      if (g) { while (i + span < d.columns.length && d.columns[i + span].c <= g.to) span++; gStart[i] = true; }
      else while (i + span < d.columns.length && !d.groups.some(function(x){ var cc = d.columns[i + span].c; return cc >= x.from && cc <= x.to; })) span++;
      var cls = [(i + span <= stickyN) ? 'sticky' : '', g ? 'gstart' : ''].filter(Boolean).join(' ');
      nameCells.push('<th colspan="' + span + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + (g ? esc(g.text) : '') + '</th>');
      stepCells.push('<th colspan="' + span + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + (g && g.step ? esc(g.step) : '') + '</th>');
      i += span;
    }
    grpHtml = '<tr class="grp">' + nameCells.join('') + '<th></th></tr>' +
              (d.groups.some(function(g){ return g.step; }) ? '<tr class="grp steprow">' + stepCells.join('') + '<th></th></tr>' : '');
  }

  var cfNow = state.colFilters[state.tab] || {}, srtNow = state.sort[state.tab];
  var head = '<tr class="hdr">' + d.columns.map(function(c, i){
    var on = !!cfNow[c.name] || (srtNow && srtNow.name === c.name);
    var hc = [(i < stickyN ? 'sticky' : ''), (gStart[i] ? 'gstart' : '')].filter(Boolean).join(' ');
    return '<th' + (hc ? ' class="' + hc + '"' : '') + '><div class="th-in"><span>' + esc(c.name) + '</span>' +
      '<button type="button" class="fbtn' + (on ? ' on' : '') + '" data-ci="' + i + '" title="Filter / sort" aria-label="' + esc(c.name) + ' filter">' +
      (srtNow && srtNow.name === c.name ? (srtNow.dir > 0 ? '▲' : '▼') : '▾') + '</button></div></th>';
  }).join('') + '<th>Sheet</th></tr>';

  var sheetUrl = 'https://docs.google.com/spreadsheets/d/' + (cfg.sheetId || SHEET_ID) + '/edit#gid=' + cfg.gid + '&range=A';
  var body = rows.map(function(r){
    return '<tr>' + r.c.map(function(cell, i){
      var cls = [], inner, nv = norm(cell.v);
      if (i < stickyN) cls.push('sticky');
      if (gStart[i]) cls.push('gstart');
      if (wrapCols.indexOf(i) !== -1) cls.push('wrapcell');
      var ed = edit[i], ld = ed ? rowLd(d, r) : '';
      if (ed && cell.opts && ld) inner = '<select data-field="cell" data-ld="' + esc(ld) + '" data-i="' + i + '"' +
        (state.pending[state.tab + '|' + ld + '|' + i] ? ' disabled' : '') +
        ' class="' + (cell.v && (nv === 'yes' || nv === 'no') ? nv : nv === 'done' ? 'yes' : '') + (state.pending[state.tab + '|' + ld + '|' + i] ? ' saving' : '') + '">' +
        '<option value="">—</option>' + cell.opts.map(function(v){ return '<option' + (norm(v) === nv ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') +
        (cell.v && !cell.opts.some(function(v){ return norm(v) === nv; }) ? '<option selected>' + esc(cell.v) + '</option>' : '') + '</select>';
      else if (cell.u) inner = '<a class="lk ' + (nv === 'editform' ? 'edit' : 'fill') + '" href="' + esc(cell.u) + '" target="_blank" rel="noopener">' + esc(cell.v) + '</a>';
      else if (nv === 'done') inner = '<span class="badge">Done</span>';
      else if (nv === 'yes') inner = '<span class="yes">Yes</span>';
      else if (nv === 'no')  inner = '<span class="no">No</span>';
      else if (iDelay.indexOf(i) !== -1 && cell.v) inner = cell.v.trim() === '-' ? '<span class="ontime">-</span>' : '<span class="late">' + esc(cell.v) + '</span>';
      else inner = esc(cell.v);
      return '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' + inner + '</td>';
    }).join('') + '<td><a class="open" href="' + sheetUrl + r.r + '" target="_blank" rel="noopener" title="Sheet me ye row kholo">↗ Open</a></td></tr>';
  }).join('');

  wrap.innerHTML = rows.length ? '<table><thead>' + grpHtml + head + '</thead><tbody>' + body + '</tbody></table>' : '<div class="empty">' + (state.user === '?' && state.tab === 'mkt'
      ? 'Portal se aapka naam nahi aaya (link me <b>{name}</b> hi aaya). Portal me {name} ki jagah login wale ka naam bharna hai.'
      : 'Koi row nahi mili.') + '</div>';
  Array.prototype.forEach.call(wrap.querySelectorAll('select[data-field]'), function(s){ s.onchange = saveCell; });
  Array.prototype.forEach.call(wrap.querySelectorAll('.fbtn'), function(b){
    b.onclick = function(e){ e.stopPropagation(); openColFilter(this, +this.getAttribute('data-ci')); };
  });

  var tbl = wrap.querySelector('table');
  if (tbl) {
    // har frozen column ka left = usse pehle ke frozen columns ki chaudai ka jod (fractional width bhi)
    var hdrCells = tbl.querySelectorAll('tr.hdr th'), lefts = [], acc = 0;
    for (var x = 0; x < stickyN && x < hdrCells.length; x++) { lefts.push(acc); acc += hdrCells[x].getBoundingClientRect().width; }
    // screen chhoti ho aur frozen hissa 60% se zyada ho jaye → sirf pehle 2 column freeze
    if (acc > wrap.clientWidth * 0.6 && stickyN > 2) {
      Array.prototype.forEach.call(tbl.querySelectorAll('.sticky'), function(el){ el.classList.remove('sticky'); });
      lefts = [0, hdrCells[0] ? hdrCells[0].getBoundingClientRect().width : 0];
      Array.prototype.forEach.call(tbl.querySelectorAll('tr'), function(tr){
        if (tr.classList.contains('grp')) return;
        var cells = tr.children; for (var y = 0; y < 2 && y < cells.length; y++) cells[y].classList.add('sticky');
      });
    }
    Array.prototype.forEach.call(tbl.querySelectorAll('tr'), function(tr){
      var st = tr.querySelectorAll('.sticky');
      if (tr.classList.contains('grp')) { if (st[0]) st[0].style.left = '0px'; return; }
      Array.prototype.forEach.call(st, function(el, k){ el.style.left = (lefts[k] || 0) + 'px'; });
    });
  }
}

/* ---------- Row dropdowns → sheet me save ----------
 *  Dropdown wahi jo SHEET me hai: jis cell me backend ne data validation list lagayi hai (getMeta se aati hai),
 *  usi list ke options ke saath. Columns aage-peeche karo to bhi apne aap sahi.
 *  FMS ke A:G (Enquiry Sheet ka formula) kabhi edit nahi hote.
 *  New Client Enquiry tab sirf dekhne ke liye hai (editCols wahan kuch nahi deta).
 */
// row ka LD: "Lead No" column se, warna Links ke URL (…?ld=LD-185) se (MKT me Lead No column nahi hai)
function rowLd(d, r){
  var i = colIndex(d, ['leadno']);
  if (i >= 0 && r.c[i].v) return r.c[i].v.trim();
  var l = colIndex(d, ['links', 'link']), m = l >= 0 && String(r.c[l].u || '').match(/[?&]ld=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}

// har column ki extra jaankari: sheet column number, aur Decision ho to uska Remark column
function editCols(d){
  var out = {};
  if (state.tab !== 'fms' && state.tab !== 'mkt') return out;
  d.columns.forEach(function(c, i){
    if (state.tab === 'fms' && c.c < 7) return;   // A:G = Enquiry Sheet ka formula — kabhi nahi likhna
    var ri = -1, di = -1;   // Decision step ke andar ka Remark aur Description (pichle Planned se agle Planned tak)
    if (norm(c.name) === 'decision') {
      var a0 = i; while (a0 > 0 && norm(d.columns[a0].name) !== 'planned') a0--;
      for (var x = a0; x < d.columns.length; x++) {
        var nx = norm(d.columns[x].name);
        if (x > i && nx === 'planned') break;
        if (ri < 0 && nx === 'remark') ri = x;
        if (di < 0 && nx === 'description') di = x;
      }
    }
    out[i] = { col: c.c + 1, decision: norm(c.name) === 'decision', remarkI: ri, descI: di,
               descCol: di >= 0 ? d.columns[di].c + 1 : 0 };
  });
  return out;
}

// value turant dashboard me dikhao (agla dropdown bhi turant khule), save peeche chalta hai; fail → purani value wapas
function saveCell(){
  var s = this, ld = s.getAttribute('data-ld'), i = +s.getAttribute('data-i'), value = s.value;
  var tab = state.tab, d = state.data[tab], ed = d && editCols(d)[i];
  var row = d && d.rows.filter(function(r){ return rowLd(d, r) === ld; })[0];
  if (!ed || !row) return;
  var old = row.c[i].v, ri = ed.remarkI, oldRemark = ri >= 0 ? row.c[ri].v : '';

  var di = ed.descI, oldDesc = di >= 0 ? row.c[di].v : '';
  if (ed.decision && value === 'No') {
    askRemark(ld, oldRemark, function(remark){ if (remark == null) s.value = old; else send(remark, ''); });
    return;
  }
  if (ed.decision && value === 'Yes' && di >= 0) {
    askText(ld + ' · Decision: Yes', 'Description', 'Kab se kaam shuru karenge? Order / rate / delivery ki baat…', oldDesc,
      'Decision "Yes" ke liye Description likhna zaroori hai.',
      function(desc){ if (desc == null) s.value = old; else send('', desc); });
    return;
  }
  send('', '');

  function send(remark, desc){
    var key = tab + '|' + ld + '|' + i;
    state.pending[key] = 1;
    row.c[i].v = value;
    if (remark && ri >= 0) row.c[ri].v = remark;
    if (desc && di >= 0) row.c[di].v = desc;
    renderTable();
    fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'update', tab: tab, col: ed.col, ld: ld, value: value, remark: remark }) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || 'Save nahi hua');
        if (!desc || !ed.descCol) return j;
        // Decision Yes ka Description — usi step ke "Description" column me
        return fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'update', tab: tab, col: ed.descCol, ld: ld, value: desc, remark: '' }) })
          .then(function(r){ return r.json(); })
          .then(function(j2){ if (!j2.ok) throw new Error('Decision save hua, par Description nahi: ' + (j2.error || '')); return j2; });
      })
      .then(function(){
        toast(ld + ' · saved');
        if (tab === 'fms') delete state.data.mkt;   // MKT tab kholne pe naya data aaye
      })
      .catch(function(err){ row.c[i].v = old; if (ri >= 0) row.c[ri].v = oldRemark; if (di >= 0) row.c[di].v = oldDesc; toast(ld + ': ' + (err.message || 'Save nahi hua'), true); })
      .then(function(){
        delete state.pending[key];
        if (state.tab !== tab) return;
        renderTable();
        if (!Object.keys(state.pending).length) load();   // sab save ho gaye → sheet se fresh (Planned / Actual)
      });
  }
}

// Decision "No" → Remark zaroori
function askRemark(ld, current, done){
  askText(ld + ' · Decision: No', 'Remark', 'No kyun? (zaroori)', current, 'Decision "No" ke liye Remark likhna zaroori hai.', done);
}

// chhota popup: ek zaroori text (title, label, placeholder, purana text, khali hone pe message)
function askText(title, label, placeholder, current, emptyMsg, done){
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="rmTitle">' +
    '<div class="modal-head"><h2 id="rmTitle">' + esc(title) + '</h2><button type="button" class="x" aria-label="Close">×</button></div>' +
    '<form novalidate><div class="fld"><label for="rm_text">' + esc(label) + ' <i>*</i></label>' +
    '<textarea id="rm_text" rows="3" placeholder="' + esc(placeholder) + '">' + esc(current) + '</textarea></div>' +
    '<div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div>' +
    '</form></div>';
  document.body.appendChild(m);
  var form = m.querySelector('form'), ta = m.querySelector('textarea');
  function close(v){ document.removeEventListener('keydown', onKey); m.remove(); done(v); }
  function onKey(e){ if (e.key === 'Escape') close(null); }
  document.addEventListener('keydown', onKey);
  m.querySelector('.x').onclick = function(){ close(null); };
  form.querySelector('[data-close]').onclick = function(){ close(null); };
  m.onclick = function(e){ if (e.target === m) close(null); };
  form.onsubmit = function(e){
    e.preventDefault();
    var v = ta.value.replace(/\s+/g, ' ').trim();
    if (!v) { toast(emptyMsg, true); ta.focus(); return; }
    close(v);
  };
  ta.focus();
}

/* ---------- Start ---------- */
if (API_KEY.indexOf('PASTE_') === 0) {
  root.innerHTML = '<div class="setup"><h2>Setup baaki hai</h2><p>index.html me <b>API_KEY</b> me Google Sheets API key paste karo.</p></div>';
} else {
  state.user = urlUser();
  renderShell(); load();
}
